{% extends 'base.html' %}

{% block content %}
<h2>캐릭터 관계도 삭제</h2>
<p>REQ-VIS-008: 선택한 캐릭터 관계도를 삭제하기 전 확인 절차를 제공하는 화면입니다.</p>

<p>정말로 <strong>{{ relation_map.title }}</strong> 관계도를 삭제하시겠습니까?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">삭제</button>
</form>

<p><a href="{% url 'relationships:relation_detail' work.id relation_map.id %}">관계도 상세로 돌아가기</a></p>
{% endblock %}
