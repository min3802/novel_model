{% extends 'base.html' %}

{% block content %}
<h2>크레딧 충전</h2>

<p>충전할 크레딧 상품을 선택하세요.</p>

<section class="credit-plan-list">
    {% for plan_code, plan in plans.items %}
        <article class="credit-plan-card">
            <h3>{{ plan.name }}</h3>
            <p class="credit-amount">{{ plan.credits }} CR</p>
            <p class="credit-price">{{ plan.price }}원</p>
            <button
                class="payment-button"
                type="button"
                data-plan-code="{{ plan_code }}"
                data-amount="{{ plan.price }}"
                data-order-name="w.LiGHTER {{ plan.name }}"
            >
                {{ plan.price }}원 결제
            </button>
        </article>
    {% endfor %}
</section>

<script src="https://js.tosspayments.com/v1/payment"></script>
<script>
    const clientKey = "{{ client_key }}";
    const tossPayments = TossPayments(clientKey);
    const orderPrefix = "{{ order_prefix }}";

    document.querySelectorAll(".payment-button").forEach(function (button) {
        button.addEventListener("click", function () {
            const planCode = button.dataset.planCode;
            const amount = Number(button.dataset.amount);
            const orderName = button.dataset.orderName;
            const orderId = `${orderPrefix}-${planCode.toLowerCase()}-${Date.now()}`;

            tossPayments.requestPayment("카드", {
                amount: amount,
                orderId: orderId,
                orderName: orderName,
                customerName: "테스트 사용자",
                successUrl: "{{ success_url }}",
                failUrl: "{{ fail_url }}"
            });
        });
    });
</script>

<style>
    .credit-plan-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 16px;
        max-width: 820px;
        margin-top: 24px;
    }

    .credit-plan-card {
        padding: 22px;
        border: 1px solid #d8cfc7;
        border-radius: 14px;
        background: #fffaf5;
    }

    .credit-plan-card h3 {
        margin: 0 0 14px;
    }

    .credit-amount {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
    }

    .credit-price {
        margin: 0 0 18px;
        font-size: 18px;
    }

    .payment-button {
        padding: 10px 14px;
        border: 0;
        border-radius: 8px;
        background: #061936;
        color: white;
        font-weight: 700;
        cursor: pointer;
    }

    .payment-button:hover {
        background: #112c58;
    }
</style>
{% endblock %}
